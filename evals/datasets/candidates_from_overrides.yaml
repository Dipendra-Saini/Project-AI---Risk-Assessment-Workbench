cases:
- id: OV-CR-2026-0002
  title: Cross-border instant payouts for gig workers
  change_type: new_product
  business_line: Payments
  description: Let platform companies pay gig workers instantly, including workers
    abroad.
  document: 'Product brief. GigPay lets ride-hailing and delivery platforms pay their
    gig workers in real time.

    Workers are individual retail consumers who onboard in our mobile app; platforms
    integrate through our API.

    Payouts are instant and settle in seconds. About 30% of payouts go cross-border
    to workers in Veridia and Brightland,

    the rest stay in Avalon. Payout processing is handled by our partner PayRoute
    Ltd as payment processor.

    Expected monthly value is USD 25 million across roughly 400,000 payouts.

    Controls: eKYC with document and liveness check for every worker, real-time sanctions
    screening of every payout,

    and a velocity limit of USD 2,000 per worker per day.

    '
  expected:
    facts:
      customer_types:
      - retail
      geographies:
      - Avalon
      - Veridia
      - Brightland
      channels:
      - mobile
      - api
      third_party_roles:
      - payments_processing
      cross_border: true
      cash: false
      crypto: false
      instant_payments: true
      anonymous_or_prepaid: false
      monthly_value_usd: 25000000.0
      controls:
      - C-KYC-01
      - C-LIM-01
      - C-SAN-01
    residual_tier: Medium
  provenance:
    status: ANALYST_REVIEW
    corrections:
    - type: factor
      key: GEO
      old:
        likelihood: 4
        impact: 4
        origin: rule
        rule_ids:
        - GEO-03
        - GEO-04
      new:
        likelihood: 4
        impact: 4
      reason: Veridia payouts are 30% of volume and Veridia is on increased monitoring;
        rule rating understates concentration
      tier_before: Medium
      tier_after: Medium
    review: PENDING SME REVIEW - do not add to golden set without sign-off
