# Golden evaluation set v1 - 25 synthetic change requests.
#
# `expected.facts` = what a careful analyst would extract from the text.
# `expected.residual_tier` = scenario designer's judgement of the residual tier,
#   set BEFORE running the scoring engine so the eval is not circular.
#   Status: authored by the team, pending FCRM SME review (see evals/README.md).
# `must_cite` = policy chunks an assessment of this case should rely on.
# All names, companies and jurisdictions are fictional.

cases:
  - id: G01
    title: Cross-border instant payouts for gig workers
    change_type: new_product
    business_line: Payments
    description: Let platform companies pay gig workers instantly, including workers abroad.
    document: |
      Product brief. GigPay lets ride-hailing and delivery platforms pay their gig workers in real time.
      Workers are individual retail consumers who onboard in our mobile app; platforms integrate through our API.
      Payouts are instant and settle in seconds. About 30% of payouts go cross-border to workers in Veridia and Brightland,
      the rest stay in Avalon. Payout processing is handled by our partner PayRoute Ltd as payment processor.
      Expected monthly value is USD 25 million across roughly 400,000 payouts.
      Controls: eKYC with document and liveness check for every worker, real-time sanctions screening of every payout,
      and a velocity limit of USD 2,000 per worker per day.
    expected:
      facts:
        customer_types: [retail]
        geographies: [Avalon, Veridia, Brightland]
        channels: [mobile, api]
        third_party_roles: [payments_processing]
        cross_border: true
        cash: false
        crypto: false
        instant_payments: true
        anonymous_or_prepaid: false
        monthly_value_usd: 25000000
        controls: [C-KYC-01, C-SAN-01, C-LIM-01]
      residual_tier: Medium
      must_cite: [AML-POL-4.2, AML-POL-6.2, NPA-POL-3.1]

  - id: G02
    title: Retail crypto trading and custody in the mobile app
    change_type: new_product
    business_line: Consumer Banking
    description: Allow retail customers to buy, sell and hold virtual assets in the app.
    document: |
      We will let existing retail customers buy, sell and hold bitcoin and ether in the mobile app and on online banking.
      Crypto assets will be held by our custody partner VaultCore Custody. Service limited to residents of Avalon.
      Expected monthly trading value USD 40 million.
      Controls: blockchain analytics on all deposits and withdrawals, wallet screening against sanctions lists,
      and eKYC with liveness for any customer enabling crypto.
    expected:
      facts:
        customer_types: [retail]
        geographies: [Avalon]
        channels: [mobile, online]
        third_party_roles: [custody]
        cross_border: false
        cash: false
        crypto: true
        instant_payments: false
        anonymous_or_prepaid: false
        monthly_value_usd: 40000000
        controls: [C-CRY-01, C-SAN-01, C-KYC-01]
      residual_tier: High
      must_cite: [NPA-POL-3.3, SAN-POL-3.1, TPR-POL-2.3]

