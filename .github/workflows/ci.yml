name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_MODE: replay          # recorded LLM responses: deterministic, $0, no API keys in CI
  PYTHONPATH: src/backend

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: pip install -r src/backend/requirements.txt
      - name: Lint
        run: ruff check src/backend tests scripts evals ops
      - name: Unit and API tests
        run: pytest -q tests/unit tests/api
      - name: Golden-set evals (gates fail the build)
        run: python evals/run_evals.py --mode replay --label ci
      - name: Held-out extraction check
        run: python evals/run_evals.py --mode replay --dataset data/synthetic/change_requests.jsonl --label ci-heldout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/*ci*

  postgres:
    # Same tests against Postgres + pgvector, the production database.
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: raw
          POSTGRES_PASSWORD: raw
          POSTGRES_DB: raw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raw" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://raw:raw@localhost:5432/raw
      CHECKPOINT_URL: postgresql://raw:raw@localhost:5432/raw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: pip install -r src/backend/requirements.txt
      - name: Migrations apply cleanly
        run: cd src/backend && PYTHONPATH=. alembic upgrade head
      - name: Lifecycle against Postgres (append-only triggers, pgvector retrieval, PostgresSaver)
        run: python scripts/seed.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt
      - run: python -m venv .venv && .venv/bin/pip install -r src/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: cd src/frontend && npm ci && npx playwright install --with-deps chromium
      - name: Playwright lifecycle (PO -> analyst x2 -> committee x3)
        run: cd src/frontend && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/frontend/playwright-report

  load:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/backend/requirements.txt
      - name: Start API (offline LLM mode)
        run: |
          LLM_MODE=offline python scripts/seed.py
          LLM_MODE=offline uvicorn raw.main:app --app-dir src/backend --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: k6 smoke (thresholds fail the build)
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/smoke.js
        env:
          BASE: http://localhost:8000
