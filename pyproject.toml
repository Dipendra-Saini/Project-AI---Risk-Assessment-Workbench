[project]
name = "risk-assessment-workbench"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["src/frontend", "src/backend/migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP046"]  # FastAPI Depends() in defaults; Pydantic generics

[tool.ruff.lint.isort]
known-first-party = ["raw"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
